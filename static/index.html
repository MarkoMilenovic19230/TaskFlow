<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskFlow</title><style>body{font-family:system-ui;background:#0f172a;color:#e2e8f0;max-width:650px;margin:70px auto;padding:20px}h1{color:#38bdf8}form{display:flex;gap:10px}input{flex:1;padding:13px;border:0;border-radius:8px}button{padding:12px;border:0;border-radius:8px;cursor:pointer;background:#38bdf8;color:#082f49;font-weight:bold}li{display:flex;align-items:center;gap:12px;background:#1e293b;padding:12px;margin:10px 0;border-radius:8px}li span{flex:1}.done{text-decoration:line-through;opacity:.55}.delete{background:#fb7185;color:#450a0a}#error{color:#fda4af}</style></head><body><h1>✓ TaskFlow</h1><p>Docker • FastAPI • PostgreSQL</p><form id="form"><input id="title" maxlength="200" required placeholder="What needs to be done?"><button>Add task</button></form><p id="error" role="alert"></p><ul id="tasks" style="list-style:none;padding:0"></ul><script>
const tasks=document.getElementById('tasks'),error=document.getElementById('error');
async function request(url,options){const r=await fetch(url,options);if(!r.ok)throw Error('Request failed ('+r.status+')');return r.status===204?null:r.json()}
async function load(){try{error.textContent='';const data=await request('/api/tasks');tasks.replaceChildren();for(const task of data){const li=document.createElement('li'),cb=document.createElement('input'),span=document.createElement('span'),del=document.createElement('button');cb.type='checkbox';cb.checked=task.completed;cb.onchange=()=>run(()=>request('/api/tasks/'+task.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({completed:cb.checked})}));span.textContent=task.title;if(task.completed)span.className='done';del.textContent='Delete';del.className='delete';del.onclick=()=>run(()=>request('/api/tasks/'+task.id,{method:'DELETE'}));li.append(cb,span,del);tasks.append(li)}}catch(e){error.textContent=e.message}}
async function run(action){try{await action();await load()}catch(e){error.textContent=e.message}}
document.getElementById('form').onsubmit=async e=>{e.preventDefault();const input=document.getElementById('title');await run(()=>request('/api/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:input.value})}));if(!error.textContent)input.value=''};load();
</script></body></html>
